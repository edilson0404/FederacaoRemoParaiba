<style>
/* =====================================================================
   FRPB — Estilos da plataforma
   Temas: padrao | claro | escuro | allblack  (atributo data-theme no <html>)
   Cores institucionais globais: --brand-* (podem ser sobrescritas pelo superusuário)
   ===================================================================== */
:root {
  --brand-primaria: #0B2A4A;
  --brand-verde: #0F9D58;
  --brand-amarelo: #F4C430;
  --brand-vermelho: #D62828;
  --brand-preto: #111111;

  --radius: 12px;
  --radius-sm: 8px;
  --sidebar-w: 260px;
  --sidebar-w-min: 72px;
  --topbar-h: 64px;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Barlow Condensed", "Inter", system-ui, sans-serif;
  --ease: cubic-bezier(.2,.7,.2,1);
}

/* ---------- Tema padrão (institucional) ---------- */
:root, [data-theme="padrao"] {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --surface-2: #F7F9FB;
  --border: #E2E7EE;
  --text: #0F1B2A;
  --muted: #5B6B7F;
  --primary: var(--brand-primaria);
  --primary-contrast: #FFFFFF;
  --accent: var(--brand-verde);
  --sidebar-bg: var(--brand-primaria);
  --sidebar-text: rgba(255,255,255,.78);
  --sidebar-text-strong: #FFFFFF;
  --sidebar-hover: rgba(255,255,255,.08);
  --sidebar-active: rgba(255,255,255,.14);
  --focus: #3B82F6;
  --shadow: 0 1px 2px rgba(15,27,42,.06), 0 4px 16px rgba(15,27,42,.05);
  --shadow-lg: 0 20px 50px rgba(15,27,42,.18);
  --ok: #0F9D58; --warn: #B7791F; --danger: #D62828; --info: #2563EB;
  --ok-bg: #E7F6EE; --warn-bg: #FFF6DB; --danger-bg: #FDECEC; --info-bg: #E8F0FE; --neutral-bg: #EEF2F6;
  color-scheme: light;
}
[data-theme="claro"] {
  --bg: #FAFBFC; --surface: #FFFFFF; --surface-2: #F5F7FA; --border: #E6EAF0;
  --text: #111827; --muted: #6B7280;
  --primary: var(--brand-primaria); --primary-contrast: #FFFFFF; --accent: var(--brand-verde);
  --sidebar-bg: #FFFFFF; --sidebar-text: #4B5563; --sidebar-text-strong: #111827;
  --sidebar-hover: #F3F4F6; --sidebar-active: #EEF2F7;
  color-scheme: light;
}
[data-theme="escuro"] {
  --bg: #0E1621; --surface: #152131; --surface-2: #1B2A3D; --border: #24364C;
  --text: #E6EDF5; --muted: #93A4B8;
  --primary: #4C8DD6; --primary-contrast: #FFFFFF; --accent: #2BB673;
  --sidebar-bg: #0A111A; --sidebar-text: #9FB0C3; --sidebar-text-strong: #FFFFFF;
  --sidebar-hover: rgba(255,255,255,.06); --sidebar-active: rgba(76,141,214,.18);
  --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 24px 60px rgba(0,0,0,.5);
  --ok-bg: rgba(43,182,115,.15); --warn-bg: rgba(244,196,48,.14); --danger-bg: rgba(214,40,40,.18);
  --info-bg: rgba(76,141,214,.18); --neutral-bg: rgba(255,255,255,.07);
  --ok: #3CCB86; --warn: #F4C430; --danger: #FF6B6B; --info: #7FB2EC;
  color-scheme: dark;
}
[data-theme="allblack"] {
  --bg: #000000; --surface: #0B0B0B; --surface-2: #121212; --border: #1F1F1F;
  --text: #F2F2F2; --muted: #8C8C8C;
  --primary: #FFFFFF; --primary-contrast: #000000; --accent: var(--brand-amarelo);
  --sidebar-bg: #000000; --sidebar-text: #9A9A9A; --sidebar-text-strong: #FFFFFF;
  --sidebar-hover: #111111; --sidebar-active: #1A1A1A;
  --shadow: none; --shadow-lg: 0 24px 60px rgba(0,0,0,.8);
  --ok-bg: rgba(60,203,134,.12); --warn-bg: rgba(244,196,48,.12); --danger-bg: rgba(255,107,107,.14);
  --info-bg: rgba(255,255,255,.08); --neutral-bg: rgba(255,255,255,.06);
  --ok: #3CCB86; --warn: #F4C430; --danger: #FF6B6B; --info: #BDBDBD;
  color-scheme: dark;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font); font-size: 14.5px; line-height: 1.5;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
a { color: var(--primary); }
[data-theme="escuro"] a, [data-theme="allblack"] a { color: var(--info); }
h1, h2, h3 { font-family: var(--font-display); letter-spacing: .01em; margin: 0; }
h1 { font-size: 28px; font-weight: 700; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 600; font-family: var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus, #3B82F6); outline-offset: 2px; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.nowrap { white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
[data-lucide] { width: 18px; height: 18px; stroke-width: 1.9; flex: none; }

/* Faixa tricolor (Brasil | Paraíba) */
.tricolor { height: 4px; background: linear-gradient(90deg,
  var(--brand-verde) 0 25%, var(--brand-amarelo) 25% 50%, var(--brand-preto) 50% 75%, var(--brand-vermelho) 75% 100%); }

/* ---------- Botões ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px; justify-content: center;
  height: 38px; padding: 0 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  cursor: pointer; font-weight: 500; white-space: nowrap; text-decoration: none;
  transition: background .15s var(--ease), border-color .15s, transform .1s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-contrast); }
.btn-primary:hover { background: var(--primary); filter: brightness(1.1); }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-danger:hover { background: var(--danger); filter: brightness(1.08); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--neutral-bg); }
.btn-sm { height: 32px; padding: 0 10px; font-size: 13px; }
.btn-icon { width: 38px; padding: 0; }
.btn-icon.btn-sm { width: 32px; }

/* ---------- Formulários ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field .req { color: var(--danger); }
.input, .select, .textarea {
  width: 100%; height: 40px; padding: 0 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  transition: border-color .15s, box-shadow .15s;
}
.textarea { height: auto; min-height: 92px; padding: 10px 12px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
.input.invalid, .select.invalid, .textarea.invalid { border-color: var(--danger); }
.field-error { color: var(--danger); font-size: 12px; min-height: 0; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--primary); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px 16px; }
.form-grid .span-2 { grid-column: 1 / -1; }
.form-section { grid-column: 1 / -1; font-family: var(--font-display); font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding-top: 6px; border-top: 1px solid var(--border); }
.color-input { display: flex; gap: 8px; align-items: center; }
.color-input input[type=color] { width: 44px; height: 40px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); padding: 2px; }
.img-field { display: flex; gap: 12px; align-items: center; }
.img-field img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); }

/* ---------- Layout ---------- */
.app { display: flex; min-height: 100vh; }
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--sidebar-w); z-index: 40;
  background: var(--sidebar-bg); color: var(--sidebar-text);
  display: flex; flex-direction: column; border-right: 1px solid color-mix(in srgb, var(--border) 50%, transparent);
  transition: width .25s var(--ease), transform .25s var(--ease);
}
[data-theme="padrao"] .sidebar { border-right: none; }
.sidebar-brand { display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-height: var(--topbar-h); }
.sidebar-brand img { width: 40px; height: 40px; border-radius: 50%; flex: none; background: #fff; }
.sidebar-brand .t1 { color: var(--sidebar-text-strong); font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.05; letter-spacing: .02em; }
.sidebar-brand .t2 { font-size: 11px; opacity: .75; }
.nav { flex: 1; overflow-y: auto; padding: 6px 10px 16px; scrollbar-width: thin; }
.nav-group { margin-top: 14px; }
.nav-group-title { font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding: 0 10px 6px; opacity: .6; }
.nav a {
  display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 9px;
  color: var(--sidebar-text); text-decoration: none; font-weight: 500;
  transition: background .15s, color .15s;
}
.nav a:hover { background: var(--sidebar-hover); color: var(--sidebar-text-strong); }
.nav a.active { background: var(--sidebar-active); color: var(--sidebar-text-strong); box-shadow: inset 3px 0 0 var(--brand-amarelo); }
.nav a .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-foot { padding: 10px 16px 14px; font-size: 11px; opacity: .6; }

.main { flex: 1; margin-left: var(--sidebar-w); min-width: 0; display: flex; flex-direction: column; transition: margin-left .25s var(--ease); }
body.collapsed .sidebar { width: var(--sidebar-w-min); }
body.collapsed .main { margin-left: var(--sidebar-w-min); }
body.collapsed .sidebar .lbl, body.collapsed .sidebar-brand .txt, body.collapsed .nav-group-title, body.collapsed .sidebar-foot { display: none; }
body.collapsed .nav a { justify-content: center; }

.topbar {
  position: sticky; top: 0; z-index: 30; height: var(--topbar-h);
  display: flex; align-items: center; gap: 10px; padding: 0 20px;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--border);
}
.search { position: relative; flex: 1; max-width: 460px; }
.search .input { padding-left: 38px; background: var(--surface-2); }
.search > [data-lucide] { position: absolute; left: 12px; top: 11px; color: var(--muted); }
.search-results { position: absolute; top: 46px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg); max-height: 380px; overflow: auto; padding: 6px; }
.search-results a { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--text); }
.search-results a:hover, .search-results a:focus { background: var(--surface-2); }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.bell { position: relative; }
.bell .dot { position: absolute; top: 4px; right: 4px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--brand-vermelho); color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: var(--primary-contrast); display: grid; place-items: center; font-weight: 700; font-size: 13px; overflow: hidden; flex: none; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.user-chip { display: flex; align-items: center; gap: 10px; padding: 4px 8px 4px 4px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
.user-chip .nm { font-weight: 600; font-size: 13px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.dropdown { position: absolute; right: 0; top: 48px; width: 340px; max-width: calc(100vw - 32px); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg); z-index: 60; overflow: hidden; animation: pop .16s var(--ease); }
.dropdown-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.dropdown-body { max-height: 420px; overflow: auto; }
.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; background: none; border: 0; text-align: left; cursor: pointer; color: var(--text); text-decoration: none; }
.menu-item:hover { background: var(--surface-2); }
.notif { display: flex; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
.notif:hover { background: var(--surface-2); }
.notif.unread { background: color-mix(in srgb, var(--info-bg) 60%, transparent); }
.notif .ttl { font-weight: 600; font-size: 13px; }
.notif .msg { font-size: 12.5px; color: var(--muted); }

.content { padding: 24px; max-width: 1480px; width: 100%; margin: 0 auto; flex: 1; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head .sub { color: var(--muted); margin-top: 4px; }
.page-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.page-actions .select { width: auto; min-width: 150px; }
.app-foot { padding: 16px 24px; color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--border); }

/* ---------- Cards, KPIs ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-pad { padding: 18px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 0; }
.card-head h3 { font-size: 14.5px; }
.card-body { padding: 14px 18px 18px; }
.grid { display: grid; gap: 16px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; margin-bottom: 16px; }
.kpi { padding: 16px; display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden; text-decoration: none; color: inherit; transition: transform .15s var(--ease), box-shadow .15s; }
a.kpi:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.kpi .lbl { font-size: 12px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.kpi .val { font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi .hint { font-size: 12px; color: var(--muted); }
.kpi::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--kpi-color, var(--primary)); }
.charts { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
.col-4 { grid-column: span 4; } .col-6 { grid-column: span 6; } .col-8 { grid-column: span 8; } .col-12 { grid-column: span 12; }
.chart-box { position: relative; height: 270px; }
.chart-state { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; padding: 16px; }

.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border); }
.list li:last-child { border-bottom: 0; }
.date-chip { min-width: 46px; text-align: center; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); padding: 4px 6px; line-height: 1.1; }
.date-chip b { display: block; font-family: var(--font-display); font-size: 19px; }
.date-chip span { font-size: 10.5px; text-transform: uppercase; color: var(--muted); }

/* ---------- Badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--neutral-bg); color: var(--muted); white-space: nowrap; }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.danger { background: var(--danger-bg); color: var(--danger); }
.badge.info { background: var(--info-bg); color: var(--info); }
.badge.demo { background: var(--warn-bg); color: var(--warn); font-size: 10.5px; letter-spacing: .05em; }
.dot-c { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }

/* ---------- Tabelas ---------- */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.toolbar .search { max-width: 320px; }
.toolbar .select { width: auto; min-width: 150px; }
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 11px 14px; background: var(--surface-2); border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl th.sortable { cursor: pointer; user-select: none; }
.tbl th.sortable:hover { color: var(--text); }
.tbl td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tbody tr { transition: background .12s; }
.tbl tbody tr.clickable { cursor: pointer; }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .thumb { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; background: var(--surface-2); vertical-align: middle; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.progress { height: 7px; background: var(--neutral-bg); border-radius: 99px; overflow: hidden; min-width: 80px; }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

/* ---------- Estados ---------- */
.state { padding: 42px 20px; text-align: center; color: var(--muted); }
.state [data-lucide] { width: 34px; height: 34px; opacity: .6; margin-bottom: 8px; }
.state.error { color: var(--danger); }
.skeleton { background: linear-gradient(90deg, var(--surface-2), var(--border), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 6px; height: 14px; }
.spinner { width: 20px; height: 20px; border: 2.5px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }
.alert { padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid; display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; }
.alert.warn { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 35%, transparent); color: var(--text); }
.alert.danger { background: var(--danger-bg); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
.alert.info { background: var(--info-bg); border-color: color-mix(in srgb, var(--info) 30%, transparent); }

/* ---------- Modal / Toast ---------- */
.modal-backdrop { position: fixed; inset: 0; background: rgba(5,12,22,.55); z-index: 100; display: grid; place-items: center; padding: 16px; animation: fade .15s; }
.modal { width: 100%; max-width: 720px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-lg); animation: pop .18s var(--ease); }
.modal.sm { max-width: 460px; } .modal.lg { max-width: 980px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.modal-head h2 { font-size: 20px; }
.modal-body { padding: 20px; overflow-y: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.modal-foot .left { margin-right: auto; display: flex; gap: 8px; }
.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 200; display: flex; flex-direction: column; gap: 8px; max-width: calc(100vw - 32px); }
.toast { display: flex; gap: 10px; align-items: flex-start; min-width: 260px; max-width: 420px; padding: 12px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-lg); animation: slide .2s var(--ease); }
.toast.ok [data-lucide] { color: var(--ok); } .toast.error [data-lucide] { color: var(--danger); } .toast.warn [data-lucide] { color: var(--warn); }

/* ---------- Telas de acesso ---------- */
.auth { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
.auth-hero { position: relative; color: #fff; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
  background: radial-gradient(1100px 700px at 110% 110%, rgba(214,40,40,.55), transparent 60%), radial-gradient(700px 500px at -10% -10%, rgba(214,40,40,.18), transparent 60%), linear-gradient(160deg, #000000 0%, #0d0d0d 55%, #3a0606 100%); background-size: cover; background-position: center; }
/* Tela de acesso nas cores da bandeira da Paraíba: preto e vermelho */
.auth-hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: linear-gradient(90deg, #000 0 33.3%, var(--brand-vermelho) 33.3% 100%); }
.auth-panel { background: linear-gradient(180deg, #ffffff, #f6f6f6); }
.auth-card h2 { color: #0d0d0d; }
.auth-card .btn-primary { background: var(--brand-vermelho); border-color: var(--brand-vermelho); color: #fff; }
.auth-card .btn-primary:hover { background: #b71f1f; }
.auth-card .link-btn { color: #b71f1f; }
.auth-card .input:focus { border-color: var(--brand-vermelho); box-shadow: 0 0 0 3px rgba(214,40,40,.18); }
.auth-card .muted, .auth-card label { color: #555; }
.auth-card .input { background: #fff; color: #111; border-color: #ddd; }
.auth-hero .logo { width: 140px; height: 140px; border-radius: 50%; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.auth-hero h1 { font-size: 46px; line-height: 1.02; margin-top: 28px; max-width: 520px; }
.auth-hero p { opacity: .82; max-width: 460px; font-size: 15px; }
.auth-panel { display: grid; place-items: center; padding: 32px 20px; background: var(--bg); }
.auth-card { width: 100%; max-width: 400px; }
.auth-card h2 { font-size: 26px; }
.auth-card form { display: flex; flex-direction: column; gap: 14px; margin-top: 20px; }
.link-btn { background: none; border: 0; color: var(--primary); cursor: pointer; padding: 0; font-weight: 600; }
[data-theme="escuro"] .link-btn, [data-theme="allblack"] .link-btn { color: var(--info); }
.center-screen { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
.center-screen .card { max-width: 520px; padding: 32px; }
.boot-logo { width: 84px; height: 84px; border-radius: 50%; animation: pulse 1.4s ease-in-out infinite; }

/* ---------- Kanban ---------- */
.kanban { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 12px; align-items: flex-start; }
.k-col { flex: 0 0 290px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; max-height: calc(100vh - 230px); }
.k-col-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; font-weight: 700; font-size: 13px; }
.k-col-head .cnt { margin-left: auto; }
.k-list { padding: 4px 10px 10px; overflow-y: auto; min-height: 60px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.k-list.drag-over { background: color-mix(in srgb, var(--info-bg) 70%, transparent); border-radius: 10px; }
.k-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; cursor: grab; box-shadow: var(--shadow); transition: transform .12s, box-shadow .12s; }
.k-card:hover { box-shadow: var(--shadow-lg); }
.k-card.dragging { opacity: .45; transform: rotate(1.5deg); }
.k-card .t { font-weight: 600; font-size: 13.5px; margin-bottom: 6px; }
.k-card .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.k-move { display: flex; gap: 6px; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border); }
.k-move .btn { flex: 1; height: 30px; font-size: 12px; gap: 4px; }
.prio-alta { box-shadow: inset 3px 0 0 var(--danger), var(--shadow); }
.prio-media { box-shadow: inset 3px 0 0 var(--warn), var(--shadow); }
.prio-baixa { box-shadow: inset 3px 0 0 var(--ok), var(--shadow); }

/* ---------- Agenda ---------- */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); border-top: 1px solid var(--border); border-left: 1px solid var(--border); }
.cal-h { padding: 8px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--surface-2); }
.cal-d { min-height: 112px; padding: 6px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cal-d.out { background: var(--surface-2); opacity: .6; }
.cal-d.today .n { background: var(--primary); color: var(--primary-contrast); }
.cal-d .n { font-size: 12px; font-weight: 700; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; }
.ev { font-size: 11.5px; padding: 2px 6px; border-radius: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; color: #fff; background: var(--c, var(--primary)); border: 0; text-align: left; width: 100%; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 10px; }
.week-col { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 8px; min-height: 260px; display: flex; flex-direction: column; gap: 6px; }
.ev-card { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--c, var(--primary)); border-radius: 8px; padding: 8px 10px; cursor: pointer; text-align: left; width: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 0 12px; height: 36px; cursor: pointer; border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--primary); color: var(--primary-contrast); }

/* ---------- Fórum ---------- */
.forum { display: grid; grid-template-columns: 240px 1fr; gap: 16px; }
.cat-list a { display: flex; justify-content: space-between; padding: 8px 12px; border-radius: 8px; text-decoration: none; color: var(--text); }
.cat-list a.on, .cat-list a:hover { background: var(--surface-2); }
.topic { display: flex; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer; align-items: flex-start; }
.topic:hover { background: var(--surface-2); }
.topic .ttl { font-weight: 600; }
.post { display: flex; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--border); }
.post.reply { margin-left: 46px; padding-top: 12px; }
.post .body { flex: 1; min-width: 0; }
.post .txt { white-space: pre-wrap; word-wrap: break-word; margin: 6px 0 8px; }
.post-actions { display: flex; gap: 4px; flex-wrap: wrap; }
.attach { display: inline-flex; gap: 6px; align-items: center; padding: 4px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 12.5px; margin: 2px 4px 2px 0; cursor: pointer; background: var(--surface-2); }

/* ---------- Abas ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 10px 14px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--text); border-bottom-color: var(--brand-amarelo); }

.kv { display: grid; grid-template-columns: 160px 1fr; gap: 8px 14px; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; word-break: break-word; }
pre.json { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-size: 12px; overflow: auto; max-height: 360px; white-space: pre-wrap; word-break: break-word; }

.partners { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
.partner { padding: 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
.partner img { width: 96px; height: 96px; object-fit: contain; }

/* ---------- Animações ---------- */
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes slide { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes pulse { 50% { transform: scale(.94); opacity: .8; } }
.view-enter { animation: fade .2s var(--ease); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- Responsivo ---------- */
.only-mobile { display: none; }
@media (max-width: 1100px) {
  .col-4 { grid-column: span 6; } .col-8 { grid-column: span 12; }
}
@media (max-width: 860px) {
  .only-mobile { display: inline-flex; }
  .sidebar { transform: translateX(-100%); width: var(--sidebar-w) !important; box-shadow: var(--shadow-lg); }
  body.nav-open .sidebar { transform: none; }
  body.collapsed .sidebar .lbl, body.collapsed .sidebar-brand .txt, body.collapsed .nav-group-title, body.collapsed .sidebar-foot { display: initial; }
  body.collapsed .nav a { justify-content: flex-start; }
  .main, body.collapsed .main { margin-left: 0; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 35; }
  .content { padding: 16px; }
  .topbar { padding: 0 12px; }
  .user-chip .nm, .hide-sm { display: none !important; }
  .charts > * { grid-column: span 12; }
  .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
  .kpi { padding: 12px; }
  .kpi .val { font-size: 24px; }
  .page-actions .select { min-width: 0; flex: 1 1 140px; }
  .form-grid { grid-template-columns: 1fr; }
  .auth { grid-template-columns: 1fr; }
  .auth-hero { padding: 28px 20px; min-height: 260px; }
  .auth-hero h1 { font-size: 32px; margin-top: 16px; }
  .auth-hero .logo { width: 84px; height: 84px; }
  .forum { grid-template-columns: 1fr; }
  .week { grid-template-columns: 1fr; }
  .cal-d { min-height: 74px; }
  .ev { font-size: 0; height: 6px; padding: 0; }
  .kv { grid-template-columns: 1fr; }
  .post.reply { margin-left: 20px; }
  .toolbar .search { max-width: none; }
}

/* ---------- Impressão (relatórios) ---------- */
@media print {
  .sidebar, .topbar, .app-foot, .no-print, .toasts { display: none !important; }
  .main { margin: 0 !important; }
  body { background: #fff; color: #000; }
  .card { box-shadow: none; border: 0; }
  .print-head { display: flex !important; }
}
.print-head { display: none; align-items: center; gap: 14px; margin-bottom: 16px; border-bottom: 3px solid var(--brand-primaria); padding-bottom: 10px; }
.print-head img { width: 54px; height: 54px; }

/* =====================================================================
   PÁGINA DE APRESENTAÇÃO (Início / site público)
   ===================================================================== */
.overline { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--brand-vermelho); }
.hero { position: relative; overflow: hidden; border-radius: 18px; color: #fff; padding: 44px 44px 72px; margin-bottom: 0;
  background:
    linear-gradient(115deg, rgba(0,0,0,.92) 0%, rgba(10,10,10,.82) 48%, rgba(150,16,16,.78) 100%),
    var(--hero-img, radial-gradient(900px 500px at 100% 100%, #D62828, transparent 60%)),
    #000;
  background-size: cover; background-position: center; }
.hero::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0 2px, transparent 2px 14px); pointer-events: none; }
.hero-in { position: relative; display: flex; gap: 36px; align-items: center; }
.hero-logo { width: 170px; height: 170px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 6px rgba(255,255,255,.08), 0 24px 60px rgba(0,0,0,.5); flex: none; }
.hero .overline { color: #ff6b6b; }
.hero h1 { font-size: clamp(30px, 4.2vw, 54px); line-height: 1; margin: 10px 0 12px; text-transform: uppercase; letter-spacing: .01em; }
.hero p { max-width: 640px; font-size: 16px; opacity: .85; margin: 0 0 22px; }
.hero-cta { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-site { background: #D62828; border-color: #D62828; color: #fff; height: 42px; padding: 0 18px; font-weight: 600; }
.btn-site:hover { background: #b71f1f; }
.btn-ghost-light { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.25); color: #fff; height: 42px; }
.btn-ghost-light:hover { background: rgba(255,255,255,.16); }
.hero-slogan { position: absolute; right: 44px; bottom: 54px; font-family: var(--font-display); font-size: 15px; letter-spacing: .22em; text-transform: uppercase; opacity: .55; }
.hero-waves { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 46px; }
.hero-waves path { fill: var(--bg); }

.stats { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 0; margin: -38px 28px 0;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-lg); overflow: hidden; }
.stat { display: flex; flex-direction: column; align-items: center; padding: 20px 10px; text-align: center; border-right: 1px solid var(--border); }
.stat:last-child { border-right: 0; }
.stat-n { font-family: var(--font-display); font-size: 40px; font-weight: 700; line-height: 1; color: var(--text); font-variant-numeric: tabular-nums; }
.stat:nth-child(odd) .stat-n { color: var(--brand-vermelho); }
.stat-l { margin-top: 6px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

.sec { margin-top: 44px; }
.sec-head { text-align: center; margin-bottom: 20px; }
.sec-head.left { text-align: left; }
.sec-head h2 { font-size: 30px; text-transform: uppercase; margin-top: 4px; }
.sec-head h2::after { content: ""; display: block; width: 56px; height: 4px; margin: 10px auto 0; border-radius: 2px; background: linear-gradient(90deg, #111 0 40%, #D62828 40% 100%); }
.sec-head.left h2::after { margin-left: 0; }
.sec-head p { color: var(--muted); max-width: 620px; margin: 10px auto 0; }
.sec.two { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }

.metas { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.meta-card { display: flex; gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); transition: transform .15s var(--ease); }
.meta-card:hover { transform: translateY(-2px); }
.ring { --p: 0; --c: var(--brand-vermelho); width: 84px; height: 84px; flex: none; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--neutral-bg) 0); }
.ring span { width: 66px; height: 66px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-family: var(--font-display); font-size: 20px; font-weight: 700; }
.meta-txt h3 { font-size: 15px; margin: 0 0 4px; }
.meta-txt p { margin: 0 0 6px; color: var(--muted); font-size: 13px; }
.meta-v { font-size: 13.5px; } .meta-v b { font-size: 18px; font-family: var(--font-display); }
.meta-p { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; gap: 4px; align-items: center; }
.meta-p [data-lucide] { width: 13px; height: 13px; }

.medals { display: flex; justify-content: space-around; margin-bottom: 12px; }
.medal { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.medal-c { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-size: 22px; font-weight: 700; box-shadow: inset 0 -4px 0 rgba(0,0,0,.18); }
.medal small { color: var(--muted); font-weight: 600; }

.ev-list, .news { display: flex; flex-direction: column; gap: 10px; }
.ev-item { display: flex; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--c); border-radius: 12px; padding: 12px 14px; }
.ev-date { width: 58px; flex: none; text-align: center; background: #111; color: #fff; border-radius: 10px; padding: 6px 0; }
.ev-date b { display: block; font-family: var(--font-display); font-size: 26px; line-height: 1; }
.ev-date span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #ff8a8a; }
.ev-item h3, .news-item h3 { font-size: 15px; margin: 2px 0 4px; }
.ev-tag { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--brand-vermelho); }
.ev-item [data-lucide] { width: 13px; height: 13px; vertical-align: -2px; }
.news-item { display: flex; gap: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.news-item img, .news-ph { width: 130px; flex: none; object-fit: cover; min-height: 100px; }
.news-ph { display: grid; place-items: center; background: linear-gradient(135deg, #111, #6b0f0f); color: #fff; }
.news-item > div { padding: 12px 14px 12px 0; }
.news-item p { margin: 0 0 6px; font-size: 13px; color: var(--muted); }

.mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.mod { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 18px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; transition: border-color .15s, transform .15s; }
.mod:hover { border-color: var(--brand-vermelho); transform: translateY(-2px); }
.mod-code { min-width: 54px; height: 54px; padding: 0 8px; border-radius: 12px; display: grid; place-items: center; background: #111; color: #fff; font-family: var(--font-display); font-size: 20px; font-weight: 700; }
.mod small { color: var(--muted); }

.site-foot { margin-top: 48px; background: #0b0b0b; color: #ddd; border-radius: 16px 16px 0 0; overflow: hidden; }
.site-foot-in { display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr; gap: 24px; padding: 28px; font-size: 13.5px; }
.site-foot b { color: #fff; display: block; margin-bottom: 6px; }
.sf-brand { display: flex; gap: 12px; align-items: center; }
.sf-brand img { width: 58px; height: 58px; border-radius: 50%; background: #fff; }
.sf-redes { display: flex; flex-wrap: wrap; gap: 10px; } .sf-redes a { color: #ff8a8a; }
.muted-l { color: #9a9a9a; }
.tricolor-pb { height: 6px; background: linear-gradient(90deg, #000 0 33.3%, #D62828 33.3% 100%); }

/* Cabeçalho do site público */
.site-top { position: sticky; top: 0; z-index: 30; background: rgba(0,0,0,.92); backdrop-filter: blur(8px); color: #fff; border-bottom: 3px solid #D62828; }
.site-wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }
.site-top-in { display: flex; align-items: center; gap: 20px; height: 68px; }
.site-brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; }
.site-brand img { width: 44px; height: 44px; border-radius: 50%; background: #fff; }
.site-brand b { display: block; font-family: var(--font-display); font-size: 20px; letter-spacing: .04em; }
.site-brand small { font-size: 11px; opacity: .7; }
.site-nav { display: flex; gap: 18px; margin-left: auto; }
.site-nav a { color: #ddd; text-decoration: none; font-weight: 600; font-size: 13.5px; text-transform: uppercase; letter-spacing: .06em; }
.site-nav a:hover { color: #ff6b6b; }
.site-top .btn-site { margin-left: 8px; }
.publico-page .hero { margin-top: 20px; }

/* "Ver como" (visualização simulada do superusuário) */
.viewas-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 20px; background: repeating-linear-gradient(135deg, #2a0707 0 12px, #1a0505 12px 24px); color: #fff; font-size: 13px; }
.viewas-bar b { color: #ffb3b3; }
.viewas-bar .btn { height: 30px; background: #fff; color: #111; border-color: #fff; }

@media (max-width: 1000px) {
  .stats { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .stat:nth-child(3) { border-right: 0; }
  .stat:nth-child(-n+3) { border-bottom: 1px solid var(--border); }
  .sec.two { grid-template-columns: 1fr; }
  .site-foot-in { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 860px) {
  .hero { padding: 28px 20px 64px; border-radius: 14px; }
  .hero-in { flex-direction: column; text-align: center; gap: 18px; }
  .hero-logo { width: 112px; height: 112px; }
  .hero-cta { justify-content: center; }
  .hero-slogan { display: none; }
  .stats { grid-template-columns: repeat(2, minmax(0,1fr)); margin: -34px 8px 0; }
  .stat { border-right: 1px solid var(--border) !important; border-bottom: 1px solid var(--border); }
  .stat:nth-child(even) { border-right: 0 !important; }
  .stat:last-child { grid-column: 1 / -1; border-bottom: 0; }
  .stat-n { font-size: 32px; }
  .sec-head h2 { font-size: 24px; }
  .news-item img, .news-ph { width: 96px; }
  .site-foot-in { grid-template-columns: 1fr; }
  .site-top .btn-site { padding: 0 12px; }
}
.metas > .state, .partners > .state, .mods > .state { grid-column: 1 / -1; }
@media (max-width: 860px) { .site-brand small { display: none; } .site-top-in { gap: 10px; } }

</style>
